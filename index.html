<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e5ea;--line2:#cfd5de;--navy:#0a1f44;--primary:#0b4aa8;--primary-d:#083a85;--tint:#eef3fb;--green:#0f8a4b;--amber:#d98a0b;--red:#c62828;--yel:#f2c200;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
.top{background:var(--navy);color:#fff;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(28px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--primary)}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.brand img{height:38px;background:#fff;border-radius:6px;padding:3px}.brand img.ffk{height:48px;width:auto;background:none;padding:0;border-radius:0}
.mono{width:40px;height:40px;border:1.5px solid rgba(255,255,255,.55);border-radius:8px;display:grid;place-items:center;font:700 15px "Barlow Condensed",Inter,sans-serif;letter-spacing:1px}
.brand .bn{font:600 22px/1 "Barlow Condensed",Inter,sans-serif;letter-spacing:1.8px;text-transform:uppercase}
.brand .bs{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;margin-top:4px;font-weight:500}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.8);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#94a3b8}
.pill.ok::before{background:#34d399}.pill.err::before{background:#f87171}.pill.wait::before{background:#fbbf24}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 70px}
.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;padding:9px 16px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn.sec{background:#fff;color:var(--primary);border-color:var(--line2)}.btn.sec:hover{background:var(--tint);border-color:var(--primary)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.dng{background:#fff;color:var(--red);border-color:#efc4c4}.btn.dng:hover{background:#fdf1f1}
.btn.grn{background:var(--green);border-color:var(--green)}.btn.grn:hover{background:#0b7340;border-color:#0b7340}
.btn.sm{padding:6px 11px;font-size:13px}
.k0{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:6px}
.h1{font:600 40px/1.05 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:8px 0 6px}
.sub{color:var(--mut);margin:0 0 22px}
.leagues{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:26px}
.hcard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:var(--r);padding:30px 30px 24px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.hcard:hover{box-shadow:0 12px 30px rgba(10,31,68,.10);border-color:var(--line2);border-left-color:var(--primary)}
.hcard .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.hcard h2{margin:8px 0 4px;font:600 46px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.hcard p{margin:0;color:var(--mut)}
.hcard .stats{display:flex;margin-top:26px;border-top:1px solid var(--line)}
.hcard .stats>div{flex:1;padding:16px 0 0}.hcard .stats>div+div{padding-left:18px;border-left:1px solid var(--line)}
.hcard .stats b{display:block;font:600 32px/1 "Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums}.hcard .stats span{font-size:12px;color:var(--mut)}
.hcard .go{margin-top:20px;font-weight:600;color:var(--primary);font-size:13px}.hcard .go::after{content:" \2192"}
.tabs{display:flex;gap:2px;margin:18px 0 22px;border-bottom:1px solid var(--line2);overflow-x:auto}
.tab{border:0;background:none;color:var(--mut);padding:12px 18px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px}
.card>b,.row>b.grow{font:600 20px/1.1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:150px}
input,select{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:9px 12px;color:var(--ink);outline:none;min-width:0}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,74,168,.14)}
label.l{font-size:11px;color:var(--mut);font-weight:700;display:block;margin-bottom:5px;letter-spacing:.07em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:8px}
.item:hover{background:#fafbfc}.item .grow{flex:1;font-weight:600}
.mcard{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;padding:14px 18px;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s}
.mcard:hover{border-color:var(--primary);background:#fafcff}
.mcard .home{text-align:right;font-weight:600;font-size:15px}.mcard .away{font-weight:600;font-size:15px}
.score{font:600 24px/1 "Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums;min-width:84px;text-align:center;padding:7px 12px;border:1px solid var(--line2);border-radius:6px;background:#f8fafc;letter-spacing:.04em;color:var(--ink)}
.score.no{color:var(--mut);font:500 13px Inter,sans-serif;letter-spacing:0}
.mmeta{grid-column:1/-1;display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mut)}
.mmeta:empty{display:none}
.cy,.cr{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:5px}
.cy{background:var(--yel)}.cr{background:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{padding:10px 8px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ink);background:none}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:#f8fafc}
.tbl td:nth-child(2){font-weight:600}.tbl td:last-child{font-weight:700;color:var(--primary);font-size:15px}
.rk{display:inline-block;width:26px;height:26px;line-height:26px;border-radius:5px;font-weight:700;font-size:13px;color:var(--ink)}
.rk.g{background:var(--green);color:#fff}.rk.o{background:var(--amber);color:#fff}
.scroll{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:32px}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-start;justify-content:center;padding:32px 14px;overflow:auto;z-index:50}
.mbox{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.mbox h2{font:600 30px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 16px}
.mh{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin-bottom:8px}
.mh .t{font:600 26px/1.1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.03em}.mh .t:first-child{text-align:right}
.sc{display:flex;align-items:center;gap:8px}.sc input{width:68px;text-align:center;font:600 30px "Barlow Condensed",Inter,sans-serif;padding:6px}
.msec{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.msec h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:#eef1f5;color:#475569;font-weight:600}
.mbox.wide{max-width:940px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mcol{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fafbfc}
.mcolh{font:600 18px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;color:var(--primary)}
.mcol .item{padding:7px 10px;margin-bottom:6px;font-size:13.5px}
.mcol .none{color:var(--mut);font-size:13px;margin-bottom:4px}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.addrow .f-name{flex:1 1 100%}
.note{font-size:13px;color:#7a4b00;background:#fff6e0;border:1px solid #f0d9a2;border-radius:6px;padding:9px 12px;margin:8px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:7px;z-index:99;display:none;font-size:14px}
.prevwrap{overflow:auto;background:#d9dee6;border:1px solid var(--line2);border-radius:10px;padding:20px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.prev{zoom:.62;box-shadow:0 4px 18px rgba(0,0,0,.2)}
#pdfStage{position:absolute;left:-99999px;top:0}
/* ---- Buletini (dizajni si në PDF) ---- */
.bpage{line-height:1.15;width:794px;height:1123px;background:#fff;color:#000;padding:48px 52px;box-sizing:border-box;font-family:"Times New Roman",Times,serif;position:relative;overflow:hidden}
.bhead{width:706px;margin:0 -8px 22px}
.bhead img{display:block;width:100%;height:auto}
.blogo{display:inline-block;margin-bottom:14px;font-family:Arial,sans-serif;font-weight:900;color:#0b2a5b;font-size:22px;letter-spacing:1px}
.blogo small{display:block;font-size:9px;font-weight:600;color:#555;letter-spacing:.4px}
.bc{font:bold 12px Calibri,Arial,sans-serif;color:#0000e0;text-decoration:underline}
.bt{text-align:center;font-weight:bold;font-size:15px;margin:10px 0}
table.bres{margin:6px auto 14px;border-collapse:collapse;width:540px}
.bres td{border:1px solid #000;font-weight:bold;font-size:16px;padding:1px 6px;background:#c5d9f1;height:23px}
.bres tr:nth-child(even) td{background:#dce6f2}
.bres td:first-child{width:28px}.bres td:nth-child(3){width:64px;text-align:center}
table.bst{border-collapse:collapse;width:100%;margin-top:8px;font-family:Calibri,Arial,sans-serif}
.bst th{background:#ddd9c4;border:1px solid #000;font:bold 16px "Times New Roman",serif;padding:2px 4px;text-align:center}
.bst td{border:1px solid #000;font-size:12px;font-weight:bold;padding:3px 5px;text-align:center;height:21px}
.bst td:nth-child(2){text-align:left;font-size:13px;text-transform:uppercase}
.bst tr:nth-child(odd) td{background:#f2f2f2}.bst tr td:last-child{background:#dce6f2!important;font-size:17px}
.bst tr.first td{background:#ffe699!important}
.bst td.rg{background:#00a651!important;color:#fff}.bst td.ro{background:#f79646!important;color:#fff}
.bst tr.first td.rg{background:#00a651!important;color:#fff}
.bst td.rl{background:#fac08f!important}.bst td.rr{background:#c00000!important;color:#fff}
.bst.bsup td{font-family:"Times New Roman",serif}
.bst.bsup tr:nth-child(even) td{background:#95b3d7}.bst.bsup tr:nth-child(odd) td{background:#dbe3ef}
.bst.bsup tr:nth-child(even) td:last-child{background:#95b3d7!important;font-size:19px}.bst.bsup tr:nth-child(odd) td:last-child{background:#dbe3ef!important;font-size:19px}
.bone .bcards td{height:15px;padding:0 10px}.bone .bres td{height:21px}.bone .bst td{height:19px;padding:2px 5px}
.bh{font:bold 17px "Times New Roman",serif;margin:50px 0 4px}
table.bcards{border-collapse:collapse;width:100%;font-size:12.5px;font-weight:bold}
.bcards td{border:1px solid #000;padding:1px 10px;height:17px}
.bcards tr.yh td{background:#ff0;font-size:17px;text-align:left;padding-left:130px;height:21px}
.bcards tr.rh td{background:#f00;font-size:17px;padding-left:130px;height:21px}
.bfoot{display:flex;justify-content:space-between;font-weight:bold;font-size:14.5px;margin:14px 60px 0 100px}
@media(max-width:640px){.two{grid-template-columns:1fr}.top{padding:0 14px}.brand .bs{display:none}.wrap{padding:18px 14px 60px}.h1{font-size:32px}.hcard h2{font-size:38px}.mcard{grid-template-columns:1fr;text-align:center;gap:10px}.mcard .home{text-align:center}.mh{grid-template-columns:1fr}.mh .t:first-child{text-align:center}.sc{justify-content:center}}

/* ---- Përshtatje për çdo pajisje ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.brand{min-width:0}.brand>div{min-width:0}.brand .bn{white-space:nowrap}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.h1{font-size:clamp(30px,5.5vw,40px)}.hcard h2{font-size:clamp(34px,6vw,46px)}
.tbl{min-width:520px}.scroll,.tabs{-webkit-overflow-scrolling:touch}
#modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:max(32px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.toast{bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:92vw;text-align:center}
@media(min-width:1400px){.wrap{max-width:1240px}.mbox{max-width:860px}.mbox.wide{max-width:1080px}body{font-size:15.5px}}
@media(min-width:1900px){.wrap{max-width:1500px}body{font-size:16.5px}}
@media(max-width:900px){.wrap{padding-top:22px}.mbox{padding:22px}.leagues{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.prev{zoom:.5}}
@media(max-width:760px){.two{grid-template-columns:1fr}.mh{grid-template-columns:1fr}.mh .t:first-child{text-align:center}}
@media(max-width:640px){
 .top{gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
 .brand{gap:10px}.brand .bn{font-size:19px;letter-spacing:1.2px}.brand img.ffk{height:40px}
 .wrap{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
 input,select{font-size:16px}
 .btn{min-height:40px}.btn.sm{min-height:36px}.tab{padding:12px 14px}
 .card{padding:16px}.hcard{padding:22px 20px 18px}.mbox{padding:16px;border-radius:10px}.mbox h2{font-size:26px}
 #modal{padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
 .item{flex-wrap:wrap}.row>.grow{min-width:120px}.sc input{width:60px}
 .prev{zoom:.4}.prevwrap{padding:10px}
 .tbl{font-size:13px}.tbl td,.tbl th{padding:9px 5px}
}
@media(max-width:480px){.pill{font-size:11px;max-width:96px;overflow:hidden;text-overflow:ellipsis}.brand .bn{font-size:17px}.prev{zoom:.36}}
@media(max-width:360px){.brand .bn{font-size:15px;letter-spacing:.8px}.pill{display:none}}
@media(max-height:480px) and (orientation:landscape){.top{position:static}}
</style>

 const bw=Math.max(...Object.keys(baselines).map(Number));
 return {id,name,tabTitle,baseWeek:bw,baselines,teams:Object.entries(TM).map(([k,n])=>({id:k,name:n})),matches:sets.flatMap(([w,l])=>mkMatches(w,l)),meta:{city:'Prishtinë',commissioner:'Getart Hyseni',dates},...extra}}

function ensureW10(d){
 if(!d||typeof d!=='object'||!d.leagues||!d.leagues.first)return d;
 const L=d.leagues.first;L.baselines=L.baselines||{};
 if(L.baselines[10]||L.matches.some(m=>m.week===10))return d;

 L.meta=L.meta||{};L.meta.dates=L.meta.dates||{};if(!L.meta.dates[10])L.meta.dates[10]='11/11/2026';

 try{localStorage.setItem('futsal_kosova_backup_v1',JSON.stringify(d))}catch(e){}
 const f=seed().leagues;d.leagues.super=f.super;
 const o=d.leagues.first;
 if(o){if(!o.baselines){o.baselines={[o.baseWeek]:o.baseline};delete o.baseline}
  if(!o.baselines[8])o.baselines[8]=f.first.baselines[8];
  if(!o.matches.some(m=>m.week===8))o.matches=f.first.matches.filter(m=>m.week===8).concat(o.matches);
  o.meta=o.meta||{};o.meta.dates=Object.assign({},f.first.meta.dates,o.meta.dates||{});o.zones='first'}
 else d.leagues.first=f.first;
 d.v=2;return d}

const tn=(L,id)=>(L.teams.find(t=>t.id===id)||{name:'?'}).name;
function weeksOf(L){return [...new Set(L.matches.map(m=>m.week))].sort((a,b)=>a-b)}
function lastWeek(L){const p=L.matches.filter(m=>m.hs!=null&&m.as!=null).map(m=>m.week);return p.length?Math.max(...p):L.baseWeek}
const isPlayed=m=>m.hs!=null&&m.as!=null;
function computeTable(L,upto){
 const rows={},bws=Object.keys(L.baselines).map(Number).sort((a,b)=>a-b);let bw=bws[0];bws.forEach(k=>{if(k<=upto)bw=k});const B=L.baselines[bw];
 L.teams.forEach(t=>{const b=B[t.id]||{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};rows[t.id]={id:t.id,name:t.name,...b}});
 const ids=new Set(L.teams.map(t=>t.id));
 const all=L.matches.filter(m=>isPlayed(m)&&m.week<=upto&&ids.has(m.home)&&ids.has(m.away));
 all.filter(m=>!m.inBase&&m.week>bw).forEach(m=>{
  const h=rows[m.home],a=rows[m.away];h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;
  if(m.hs>m.as){h.w++;h.pts+=3;a.l++}else if(m.hs<m.as){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}});
 const arr=Object.values(rows);arr.forEach(r=>r.diff=r.gf-r.ga);
 arr.sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));
 const out=[];let i=0;
 while(i<arr.length){let j=i;while(j+1<arr.length&&arr[j+1].pts===arr[i].pts)j++;
  const g=arr.slice(i,j+1);if(g.length>1)g.sort(groupCmp(g,all));out.push(...g);i=j+1}
 return out}
function groupCmp(g,all){
 const set=new Set(g.map(x=>x.id)),mini={};g.forEach(x=>mini[x.id]={pts:0,gf:0,ga:0});
 all.filter(m=>set.has(m.home)&&set.has(m.away)).forEach(m=>{const h=mini[m.home],a=mini[m.away];h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;
  if(m.hs>m.as)h.pts+=3;else if(m.hs<m.as)a.pts+=3;else{h.pts++;a.pts++}});
 return (a,b)=>{const x=mini[a.id],y=mini[b.id];
  return (y.pts-x.pts)||((y.gf-y.ga)-(x.gf-x.ga))||(y.gf-x.gf)||(b.diff-a.diff)||(b.gf-a.gf)||a.name.localeCompare(b.name)}}

let sha=null,syncT=null;
const GH_DEF={repo:'ffk-futsall/buletini',branch:'main',path:'data.json'};
const cfg=()=>{let c={};try{c=JSON.parse(localStorage.getItem(LSC)||'{}')}catch(e){}
 return {...c,repo:c.repo||GH_DEF.repo,branch:c.branch||GH_DEF.branch,path:c.path||GH_DEF.path}};
const ghOK=()=>{const c=cfg();return !!(c.repo&&c.token)};
let lastErr='';
async function ghErrText(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'GitHub '+r.status+(m?' – '+m:'')}
function setSync(s,msg){if(s==='err')lastErr=msg||'';const p=$('#syncPill');if(!p)return;S._sync=[s,msg];
 const m={local:['Pa token – vetëm lexim',''],wait:['Në pritje të ruajtjes','wait'],busy:['Duke sinkronizuar','wait'],ok:['Ruajtur në GitHub','ok'],err:[(msg||'Gabim sinkronizimi'),'err']}[s];p.textContent=m[0];p.className='pill '+m[1]}
function scheduleSync(){if(!ghOK()||cfg().auto===false){setSync('local');return}setSync('wait');clearTimeout(syncT);syncT=setTimeout(()=>ghPush(),1500)}
function ghApi(method,body){const c=cfg();
 const url=`https://api.github.com/repos/${c.repo}/contents/${encodeURI(c.path||'data.json')}`+(method==='GET'?`?ref=${encodeURIComponent(c.branch||'main')}&t=${Date.now()}`:'');
 const h={Accept:'application/vnd.github+json'};
 if(c.token)h.Authorization='Bearer '+c.token;
 if(body)h['Content-Type']='application/json';
 return fetch(url,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'})}
async function ghPull(){setSync('busy');
 try{const r=await ghApi('GET');if(r.status===404){sha=null;setSync('ok');return 'none'}
  if(!r.ok)throw new Error(await ghErrText(r));
  const j=await r.json();sha=j.sha;
  if(!j.content){const d=await fetch(j.download_url+'?t='+Date.now(),{cache:'no-store'});return await d.json()}
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}
 catch(e){setSync('err',e.message);return 'err'}}
async function ghPush(retry=true){if(!ghOK())return false;setSync('busy');
 try{if(!sha){const r=await ghApi('GET');if(r.ok)sha=(await r.json()).sha;else if(r.status!==404)throw new Error(await ghErrText(r))}
  const c=cfg(),copy={...S};delete copy._sync;
  const body={message:'Përditësim '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(copy)))),branch:c.branch||'main'};if(sha)body.sha=sha;
  const r=await ghApi('PUT',body);
  if(r.ok){sha=(await r.json()).content.sha;setSync('ok');return true}
  if((r.status===409||r.status===422)&&retry){sha=null;return ghPush(false)}
  throw new Error(await ghErrText(r))}
 catch(e){setSync('err',e.message);return false}}
async function initSync(){
 if(!ghOK()){
  await readerSync();
  setInterval(()=>{if(!document.hidden)readerSync()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)readerSync()});
  return}
 const r=migrate(await ghPull());
 if(r&&typeof r==='object'&&r.leagues){if((r.updatedAt||0)>(S.updatedAt||0)){S=r;localStorage.setItem(LS,JSON.stringify(S));render();toast('U ngarkuan të dhënat nga GitHub');setSync('ok')}else if((S.updatedAt||0)>(r.updatedAt||0))ghPush();else setSync('ok')}
 else if(r==='none')ghPush()}

async function readerSync(){

 setSync('local')}

/* --- Rezultatet --- */
function matchCard(L,m){const g=m.goals.length,y=m.cards.filter(c=>c.kind==='Y').length,r=m.cards.filter(c=>c.kind==='R').length;
 return `<div class="mcard" data-a="openMatch" data-id="${m.id}"><span class="home">${esc(tn(L,m.home))}</span><span class="score ${isPlayed(m)?'':'no'}">${isPlayed(m)?m.hs+' - '+m.as+(m.rz?'rz':''):'vs'}</span><span class="away">${esc(tn(L,m.away))}</span><div class="mmeta">${g?`<span>Gola ${g}</span>`:''}${y?`<span><i class="cy"></i>${y}</span>`:''}${r?`<span><i class="cr"></i>${r}</span>`:''}${!isPlayed(m)?'Kliko për të shënuar rezultatin':''}</div></div>`}
function viewResults(L){const ws=weeksOf(L);if(!ws.length)return '<div class="card empty">Nuk ka ndeshje. Shtoni ndeshje te “Shto ndeshje”.</div>';
 const w=ws.includes(UI.rw)?UI.rw:ws[ws.length-1];
 return `<div class="card"><div class="row"><label class="l" style="margin:0">Java:</label><select data-c="rw">${ws.map(x=>`<option value="${x}" ${x===w?'selected':''}>Java ${x}</option>`).join('')}</select></div><div class="list">${L.matches.filter(m=>m.week===w).map(m=>matchCard(L,m)).join('')}</div></div>`}
/* --- Tabela --- */
function tableHtml(L,w){const rows=computeTable(L,w);
 return `<div class="scroll"><table class="tbl"><tr><th>Nr</th><th style="text-align:left">Ekipi</th><th>Nd</th><th>Fit</th><th>Bar</th><th>Hu</th><th>G/Sh</th><th>G/P</th><th>Dif.</th><th>Pikët</th></tr>${rows.map((r,i)=>`<tr><td><span class="rk ${i<2?'g':i===2?'o':''}">${i+1}</span></td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.diff>0?'+':''}${r.diff}</td><td>${r.pts}</td></tr>`).join('')}</table></div>`}
function viewTable(L){const lw=lastWeek(L),ws=[];for(let i=Math.min(...Object.keys(L.baselines).map(Number));i<=Math.max(lw,...weeksOf(L));i++)ws.push(i);
 const w=UI.tw!=null&&ws.includes(UI.tw)?UI.tw:lw;
 return `<div class="card"><div class="row" style="margin-bottom:12px"><b class="grow">Tabela pas javës ${w}</b><select data-c="tw">${ws.map(x=>`<option value="${x}" ${x===w?'selected':''}>Pas javës ${x}</option>`).join('')}</select></div>${tableHtml(L,w)}</div>
<div class="card"><b>Rezultatet e javës ${w}</b><div class="list">${L.matches.filter(m=>m.week===w).map(m=>matchCard(L,m)).join('')||'<div class="empty">Nuk ka ndeshje.</div>'}</div></div>`}

function bulletinPages(L,w){
 const ms=L.matches.filter(m=>m.week===w),tab=computeTable(L,w),meta=L.meta||{},one=!!L.onePage,n=tab.length,sup=L.zones==='super';
 const head=`<div class="bhead"><img src="${FFK_HEADER}"></div>`;
 const titles=`<div class="bt">Buletini i Futsallit</div><div class="bt" style="margin-top:${one?2:20}px">Java e -${w}-</div>`;
 const resT=`<table class="bres">${ms.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(tn(L,m.home))}</td><td>${isPlayed(m)?m.hs+'-'+m.as+(m.rz?'rz':''):'-'}</td><td>${esc(tn(L,m.away))}</td></tr>`).join('')}</table>`;
 const tabT=`<div class="bt" style="margin-top:${one?12:20}px">TABELA e ${esc(L.tabTitle)} pas javës së -${w}-${sfx(w)}</div>`;
 const zc=i=>sup?(i<2?'rg':i<6?'ro':(n===10&&i===7)?'rl':i>=n-2?'rr':''):(i<2?'rg':i===2?'ro':'');
 const stT=`<table class="bst${sup?' bsup':''}"><tr><th style="width:30px">Nr</th><th style="text-align:left">Ekipi</th><th>Nd</th><th>Fit</th><th>Bar</th><th>Hu</th><th>G/Sh</th><th>G/P</th><th>Dif.</th><th>Pikët</th></tr>
${tab.map((r,i)=>`<tr class="${i===0&&!sup?'first':''}"><td class="${zc(i)}">${i+1}</td><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.diff>0?'+':''}${r.diff}</td><td>${r.pts}</td></tr>`).join('')}</table>`;
 const yel=[],red=[];
 ms.forEach(m=>[m.home,m.away].forEach(t=>{const nm=m.cards.filter(c=>c.kind==='Y'&&c.team===t).map(c=>c.name+(c.role==='Zyrtar'?' (zyrtar)':''));if(nm.length)yel.push([nm.join(', '),tn(L,t)]);
  m.cards.filter(c=>c.kind==='R'&&c.team===t).forEach(c=>red.push([c.name+(c.role==='Zyrtar'?' (zyrtar)':''),c.note||'',tn(L,t)]))}));
 const fy=Array(Math.max(0,(one?8:11)-yel.length)).fill('<tr><td>&nbsp;</td><td></td></tr>').join(''),fr=Array(Math.max(0,(one?5:6)-red.length)).fill('<tr><td>&nbsp;</td><td></td><td></td></tr>').join('');
 const cards=mt=>`<div class="bh" style="margin-top:${mt}px">Kartonat e ndeshjeve:</div>
<table class="bcards"><tr class="yh"><td colspan="2">KARTONAT E VERDHË</td></tr>${yel.map(r=>`<tr><td>${esc(r[0])}</td><td style="width:230px">${esc(r[1]).toUpperCase()}</td></tr>`).join('')}${fy}</table>
<table class="bcards" style="margin-top:${one?14:20}px"><tr class="rh"><td colspan="3">KARTONAT E KUQ</td></tr>${red.map(r=>`<tr><td style="width:300px">${esc(r[0])}</td><td>${esc(r[1])}</td><td style="width:200px">${esc(r[2]).toUpperCase()}</td></tr>`).join('')}${fr}</table>`;
 const foot=`<div class="bfoot"><div>${esc(meta.city||'Prishtinë')}<br>${esc((meta.dates||{})[w]||'')}</div><div>Komisari i Garave:<br>${esc(meta.commissioner||'')}</div></div>`;
 if(one)return [`<div class="bpage bone">${head}${titles}${resT}${tabT}${stT}${cards(16)}${foot}</div>`];
 return [`<div class="bpage">${head}${titles}${resT}${tabT}${stT}</div>`,`<div class="bpage">${head}${cards(120)}${foot}</div>`]}
function viewBulletin(L){const ws=weeksOf(L);if(!ws.length)return '<div class="card empty">Nuk ka javë për buletin.</div>';
 const w=ws.includes(UI.bw)?UI.bw:ws[ws.length-1],meta=L.meta=L.meta||{};meta.dates=meta.dates||{};
 return `<div class="card"><div class="row"><div><label class="l">Java</label><select data-c="bw">${ws.map(x=>`<option value="${x}" ${x===w?'selected':''}>Java ${x}</option>`).join('')}</select></div>
<div><label class="l">Qyteti</label><input data-c="mcity" value="${esc(meta.city||'')}" style="width:130px"></div>
<div><label class="l">Data e buletinit</label><input data-c="mdate" value="${esc(meta.dates[w]||'')}" placeholder="dd/mm/vvvv" style="width:130px"></div>
<div class="grow"><label class="l">Komisari i Garave</label><input data-c="mcomm" value="${esc(meta.commissioner||'')}" style="width:100%"></div>
<div style="margin-top:18px"><button class="btn grn" data-a="pdf" data-id="${w}">Shkarko PDF</button></div></div></div>
<div class="prevwrap">${bulletinPages(L,w).map(p=>`<div class="prev">${p}</div>`).join('')}</div>`}
async function downloadPdf(w){const L=cur();toast('Duke krijuar PDF…');
 try{const stage=$('#pdfStage');stage.innerHTML=bulletinPages(L,w).join('');const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');
  const pgs=[...stage.querySelectorAll('.bpage')];
  for(let i=0;i<pgs.length;i++){const c=await html2canvas(pgs[i],{scale:2,backgroundColor:'#fff',useCORS:true});pdf.addImage(c.toDataURL('image/jpeg',.93),'JPEG',0,0,210,297);if(i<pgs.length-1)pdf.addPage()}
  pdf.save(`Buletini_${L.name.replace(/\s+/g,'_')}_Java_${w}.pdf`);stage.innerHTML='';toast('PDF u shkarkua')}
 catch(e){toast('Gabim gjatë krijimit të PDF');console.error(e)}}

/* --- Modal i ndeshjes --- */
function renderModal(){const L=cur(),m=L&&L.matches.find(x=>x.id===UI.mid),md=$('#modal');if(!m){md.style.display='none';return}
 const sides=[[m.home,tn(L,m.home)],[m.away,tn(L,m.away)]];
 const names=new Set();L.matches.forEach(x=>{x.cards.forEach(c=>names.add(c.name));x.goals.forEach(g=>names.add(g.name))});
 $('#players').innerHTML=[...names].map(n=>`<option value="${esc(n)}">`).join('');
 const roleSel='<select class="f-role"><option>Lojtar</option><option>Zyrtar</option></select>';
 const delB=(k,id)=>`<button class="btn dng sm" data-a="delItem" data-k="${k}" data-id="${id}">Hiq</button>`;
 const col=(sec,t,tname,items,itemFn,extra)=>`<div class="mcol"><div class="mcolh">${esc(tname)}</div>${items.length?items.map(itemFn).join(''):'<div class="none">Asnjë.</div>'}<div class="addrow" data-sec="${sec}" data-team="${t}"><input class="f-name" list="players" placeholder="Emri i lojtarit / zyrtarit">${extra}<button class="btn sm" data-a="addItem">Shto</button></div></div>`;
 const section=(sec,title,pick,itemFn,extra)=>`<div class="msec"><h3>${title}</h3><div class="two">${sides.map(([t,n])=>col(sec,t,n,pick(t),itemFn,extra)).join('')}</div></div>`;
 md.innerHTML=`<div class="mbox wide"><div class="mh"><div class="t">${esc(sides[0][1])}</div><div class="sc"><input type="number" min="0" data-c="hs" value="${m.hs??''}"><b>:</b><input type="number" min="0" data-c="as" value="${m.as??''}"></div><div class="t">${esc(sides[1][1])}</div></div>
<div style="text-align:center;color:var(--mut);font-size:13px">Java ${m.week}</div>
<label style="display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;margin:8px 0"><input type="checkbox" data-c="rz" ${m.rz?'checked':''}> Fitore zyrtare (rz)</label>
${m.inBase?'<div class="note">Kjo ndeshje është e përfshirë në gjendjen fillestare të tabelës – ndryshimi i rezultatit nuk e ndryshon tabelën.</div>':''}
${section('G','Golashënuesit',t=>m.goals.filter(g=>g.team===t),g=>`<div class="item"><span class="grow">${esc(g.name)} <span class="tag">${g.n} gol${g.n>1?'a':''}</span></span>${delB('goals',g.id)}</div>`,'<input class="f-n" type="number" min="1" value="1" style="width:70px" title="Nr. golave">')}
${section('Y','<i class="cy"></i>Kartonat e verdhë',t=>m.cards.filter(c=>c.kind==='Y'&&c.team===t),c=>`<div class="item"><span class="grow">${esc(c.name)} <span class="tag">${esc(c.role)}</span></span>${delB('cards',c.id)}</div>`,roleSel)}
${section('R','<i class="cr"></i>Kartonat e kuq',t=>m.cards.filter(c=>c.kind==='R'&&c.team===t),c=>`<div class="item"><span class="grow">${esc(c.name)} <span class="tag">${esc(c.role)}</span><br><small style="color:var(--mut);font-weight:400">${esc(c.note)}</small></span>${delB('cards',c.id)}</div>`,roleSel+`<input class="f-note" list="rednotes" placeholder="p.sh. Dy të verdhë, pushon një lojë" style="flex-basis:100%"><datalist id="rednotes"><option value="${D1}"><option value="${D2}"></datalist>`)}
<div class="row" style="margin-top:22px;justify-content:space-between"><button class="btn dng sm" data-a="delMatchM">Fshij ndeshjen</button><button class="btn" data-a="closeModal">Mbyll</button></div></div>`;
 md.style.display='flex'}

/* --- Cilësimet --- */
function openSettings(){const c=cfg();$('#modal').innerHTML=`<div class="mbox"><h2 style="margin-top:0">Cilësimet</h2>
<div class="msec" style="border:0;margin:0;padding:0"><h3>Lidhja me GitHub</h3>
<p style="font-size:13px;color:var(--mut);margin:0 0 10px">Krijoni një <b>Fine-grained token</b> (Contents: Read and write, skadimi 1 vit) vetëm për repo-n tuaj. Token-i ruhet vetëm në këtë shfletues dhe <b>nuk</b> futet në skedarin e të dhënave.</p>
<div class="row"><input class="grow" id="gRepo" placeholder="perdoruesi/emri-i-repo" value="${esc(c.repo||'')}"><input id="gBranch" placeholder="main" value="${esc(c.branch||'main')}" style="width:100px"></div>
<div class="row" style="margin-top:8px"><input class="grow" id="gPath" placeholder="data.json" value="${esc(c.path||'data.json')}"><input class="grow" id="gTok" type="password" placeholder="github_pat_…" value="${esc(c.token||'')}"></div>
<label style="display:block;margin-top:10px"><input type="checkbox" id="gAuto" ${c.auto===false?'':'checked'}> Ruaj automatikisht pas çdo ndryshimi</label>
<div class="row" style="margin-top:12px"><button class="btn" data-a="ghSave">Ruaj cilësimet & testo</button><button class="btn sec" data-a="ghPushNow">Ruaj tani në GitHub</button><button class="btn sec" data-a="ghPullNow">Ngarko nga GitHub</button></div></div>
<div class="msec"><h3>Logo e aplikacionit (shiriti i sipërm)</h3><div class="row"><input type="file" id="logoFile" accept="image/*" data-c="logo"><button class="btn dng sm" data-a="rmLogo">Rikthe logon e FFK</button></div></div>
<div class="msec"><h3>Kopje rezervë</h3><div class="row"><button class="btn sec" data-a="export">Eksporto JSON</button><label class="btn sec" style="cursor:pointer">Importo JSON<input type="file" accept=".json" data-c="import" hidden></label><button class="btn dng" data-a="reset">Rivendos fillimin</button></div></div>
<div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn" data-a="closeModal">Mbyll</button></div></div>`;$('#modal').style.display='flex'}

/* ================== VEPRIMET ================== */
const A={
 home(){UI.view='home';UI.mid=null;render()},
 openLeague(d){UI.view='league';UI.lid=d.id;UI.tab='table';UI.rw=UI.tw=UI.bw=null;UI.addWeek=null;render()},
 tab(d){UI.tab=d.id;render()},
 addTeam(){const v=$('#newTeam').value.trim();if(!v)return toast('Shkruani emrin');const L=cur();if(L.teams.some(t=>t.name.toLowerCase()===v.toLowerCase()))return toast('Kjo skuadër ekziston');L.teams.push({id:uid(),name:v});save();render()},
 renTeam(d){const L=cur(),t=L.teams.find(x=>x.id===d.id),n=prompt('Emri i ri:',t.name);if(n&&n.trim()){t.name=n.trim();save();render()}},
 delTeam(d){const L=cur();if(L.matches.some(m=>m.home===d.id||m.away===d.id))return toast('Skuadra ka ndeshje – fshini ndeshjet më parë');if(confirm('Të fshihet skuadra?')){L.teams=L.teams.filter(t=>t.id!==d.id);Object.values(L.baselines).forEach(b=>delete b[d.id]);save();render()}},
 addMatch(){const L=cur(),w=+$('#aWeek').value,h=$('#aHome').value,a=$('#aAway').value;
  if(!w||w<=L.baseWeek)return toast('Java duhet të jetë më e madhe se '+L.baseWeek);if(!h||!a||h===a)return toast('Zgjidhni dy skuadra të ndryshme');
  if(L.matches.some(m=>m.week===w&&(m.home===h||m.away===h||m.home===a||m.away===a)))return toast('Njëra nga skuadrat luan tashmë këtë javë');
  const hs=$('#aHs').value,as=$('#aAs').value;
  L.matches.push({id:uid(),week:w,home:h,away:a,hs:hs!==''&&as!==''?+hs:null,as:hs!==''&&as!==''?+as:null,inBase:false,cards:[],goals:[]});UI.addWeek=w;save();render();toast('Ndeshja u shtua')},
 delMatch(d){if(confirm('Të fshihet ndeshja?')){const L=cur();L.matches=L.matches.filter(m=>m.id!==d.id);save();render()}},
 openMatch(d){UI.mid=d.id;renderModal()},
 closeModal(){UI.mid=null;$('#modal').style.display='none';render()},
 delMatchM(){if(confirm('Të fshihet ndeshja?')){const L=cur();L.matches=L.matches.filter(m=>m.id!==UI.mid);UI.mid=null;save();$('#modal').style.display='none';render()}},
 addItem(d,e){const L=cur(),m=L.matches.find(x=>x.id===UI.mid),r=e.target.closest('.addrow'),q=s=>r.querySelector(s),name=q('.f-name').value.trim();
  if(!name)return toast('Shkruani emrin');const sec=r.dataset.sec,team=r.dataset.team;
  if(sec==='G')m.goals.push({id:uid(),team,name,n:Math.max(1,+q('.f-n').value||1)});
  else m.cards.push({id:uid(),kind:sec,team,name,role:q('.f-role').value,note:sec==='R'?(q('.f-note').value.trim()):''});
  save();renderModal()},
 delItem(d){const m=cur().matches.find(x=>x.id===UI.mid);m[d.k]=m[d.k].filter(x=>x.id!==d.id);save();renderModal()},
 pdf(d){downloadPdf(+d.id)},
 settings(){openSettings()},
 ghSave(){localStorage.setItem(LSC,JSON.stringify({repo:$('#gRepo').value.trim(),branch:$('#gBranch').value.trim()||'main',path:$('#gPath').value.trim()||'data.json',token:$('#gTok').value.trim(),auto:$('#gAuto').checked}));sha=null;
  ghPull().then(async r=>{if(r==='err'){toast('Lidhja dështoi: '+lastErr,9000);return}
   if(!ghOK()){toast('Shkruani edhe token-in',5000);return}
   const ok=await ghPush();toast(ok?'Lidhja dhe ruajtja funksionojnë ✔':'Leximi OK, por RUAJTJA dështoi: '+lastErr,12000)})},
 async ghPushNow(){toast(await ghPush()?'U ruajt në GitHub':'Ruajtja dështoi: '+lastErr,12000)},
 async ghPullNow(){const r=migrate(await ghPull());if(r&&r.leagues){S=r;localStorage.setItem(LS,JSON.stringify(S));UI.mid=null;toast('U ngarkua nga GitHub');A.closeModal()}else toast(r==='none'?'Skedari nuk ekziston ende në GitHub':'Ngarkimi dështoi')},
 rmLogo(){S.logo='';save();render();toast('U rikthye logoja e FFK')},
 export(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='futsal-data.json';a.click()},
 reset(){if(confirm('Të rivendosen të dhënat fillestare? Çdo gjë tjetër do të humbasë.')){S=seed();save();A.closeModal()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){A[b.dataset.a](b.dataset,e)}else if(e.target.id==='modal'){A.closeModal()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;const L=UI.lid&&cur();
 if(c==='rw'){UI.rw=+t.value;render()}
 else if(c==='tw'){UI.tw=+t.value;render()}
 else if(c==='bw'){UI.bw=+t.value;render()}
 else if(c==='addWeek'){UI.addWeek=+t.value;render()}
 else if(c==='hs'||c==='as'){const m=L.matches.find(x=>x.id===UI.mid),o=$('#modal input[data-c="'+(c==='hs'?'as':'hs')+'"]').value;
  m[c]=t.value===''?null:Math.max(0,+t.value);const other=c==='hs'?'as':'hs';m[other]=o===''?null:Math.max(0,+o);
  if(m.hs==null||m.as==null){}save();toast(isPlayed(m)?'Rezultati u ruajt':'Plotësoni të dy rezultatet')}
 else if(c==='rz'){const m=L.matches.find(x=>x.id===UI.mid);m.rz=t.checked;save();toast('U ruajt')}
 else if(c==='mcity'){L.meta.city=t.value;save()}
 else if(c==='mcomm'){L.meta.commissioner=t.value;save();render()}
 else if(c==='mdate'){L.meta.dates[UI.bw||lastWeekB(L)]=t.value;save();render()}
 else if(c==='logo'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.logo=cv.toDataURL('image/png');save();toast('Logo u ruajt');render()};im.src=fr.result};fr.readAsDataURL(t.files[0])}
 else if(c==='import'&&t.files[0]){t.files[0].text().then(x=>{try{const d=migrate(JSON.parse(x));if(!d||!d.leagues)throw 0;S=d;save();toast('U importua');A.closeModal()}catch(_){toast('Skedar i pavlefshëm')}})}
});
function lastWeekB(L){const ws=weeksOf(L);return ws.includes(UI.bw)?UI.bw:ws[ws.length-1]}
if(W10ADDED)save();
render();initSync();
</script>
</body>
</html>
